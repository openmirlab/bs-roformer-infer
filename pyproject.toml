[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bs-roformer-infer"
dynamic = ["version"]
description = "Inference-only Band-Split Roformer separation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "OpenMIRLab", email = "bernie40916@gmail.com" }
]
keywords = ["audio", "source-separation", "roformer", "bs-roformer", "pytorch", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "soundfile>=0.12",
    "ml_collections>=0.1.1",
    "tqdm>=4.64",
    "beartype>=0.14",
    "rotary-embedding-torch>=0.3.5",
    "einops>=0.6.1",
    "PyYAML>=6.0",
    "requests>=2.31",
    "packaging>=14.1",
]

[project.optional-dependencies]
# Optional MLX backend (Apple Silicon). Kept out of the core install so a plain
# `pip install bs-roformer-infer` stays framework-light and importable everywhere;
# `import bs_roformer` never imports mlx. Floors only, no ceilings: mlx-audio-io
# was deliberately NOT taken as a dependency because it pins mlx to an exact
# version and ships a compiled backend, and the model path never imports it.
mlx = [
    "mlx>=0.31",
    "mlx-spectro>=0.7",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/openmirlab/bs-roformer-infer"
Documentation = "https://github.com/openmirlab/bs-roformer-infer#readme"
Repository = "https://github.com/openmirlab/bs-roformer-infer"
Issues = "https://github.com/openmirlab/bs-roformer-infer/issues"

[project.scripts]
bs-roformer-infer = "bs_roformer.inference:main"
bs-roformer-download = "bs_roformer.download:main"

[tool.hatch.version]
path = "src/bs_roformer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bs_roformer"]

[tool.hatch.build]
include = [
    "src/bs_roformer/**/*.py",
    "src/bs_roformer/configs/*.yaml",
    "src/bs_roformer/config/*.toml",
]
exclude = [
    "src/bs_roformer/data/bs_models.json",
    "src/bs_roformer/data/checksums.json",
    "src/bs_roformer/data/overrides.json",
]

[tool.uv]
dev-dependencies = [
    "build>=1.3.0",
    "pytest>=7.0",
    "ruff>=0.5",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
markers = [
    "network: hits real network endpoints (deselected by default, run with -m network)",
    "realweights: needs a real checkpoint already on disk and specific hardware (deselected by default, run with -m realweights)",
]
addopts = "-m 'not network and not realweights'"
